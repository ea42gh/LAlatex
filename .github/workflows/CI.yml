name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  # Keep only the newest run per ref so stale queued runs do not pile up.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
          - version: '1.11'
            os: ubuntu-latest
            arch: x64
          - version: '1.12'
            os: ubuntu-latest
            arch: x64
          - version: 'pre'
            os: ubuntu-latest
            arch: x64
          - version: '1.10'
            os: windows-latest
            arch: x64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: setup-python
        with:
          python-version: "3.11"
      - name: Install Python deps
        shell: bash
        run: |
          "${{ steps.setup-python.outputs.python-path }}" -m pip install --upgrade pip sympy numpy
          "${{ steps.setup-python.outputs.python-path }}" -c "import sys, sympy, numpy; print(sys.executable); print(sympy.__version__); print(numpy.__version__)"
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1
        env:
          JULIA_CONDAPKG_BACKEND: Null
          JULIA_PYTHONCALL_EXE: ${{ steps.setup-python.outputs.python-path }}
      - name: Core tests without PythonCall
        run: julia --project=. test/runtests.jl
        env:
          LALATEX_DISABLE_PYTHONCALL: "1"
          LALATEX_TEST_SUITE: core
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1
        if: matrix.version != 'pre' && matrix.version != '1.12'
        env:
          JULIA_CONDAPKG_BACKEND: Null
          JULIA_PYTHONCALL_EXE: ${{ steps.setup-python.outputs.python-path }}
      - name: Full Julia 1.12 tests without test-only quality extras
        if: matrix.version == '1.12'
        run: julia --project=. test/runtests.jl
        env:
          JULIA_CONDAPKG_BACKEND: Null
          JULIA_PYTHONCALL_EXE: ${{ steps.setup-python.outputs.python-path }}
      - name: Full prerelease tests without test-only quality extras
        if: matrix.version == 'pre'
        run: julia --project=. test/runtests.jl
        env:
          JULIA_CONDAPKG_BACKEND: Null
          JULIA_PYTHONCALL_EXE: ${{ steps.setup-python.outputs.python-path }}

  python-interop-smoke:
    name: Python interop smoke - Julia 1.10 - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: setup-python
        with:
          python-version: "3.11"
      - name: Install Python deps
        shell: bash
        run: |
          "${{ steps.setup-python.outputs.python-path }}" -m pip install --upgrade pip setuptools wheel juliacall sympy numpy
          "${{ steps.setup-python.outputs.python-path }}" -m pip install --no-build-isolation --no-deps -e .
          "${{ steps.setup-python.outputs.python-path }}" -c "import importlib.metadata as md, sys; print(sys.executable); print(md.version('juliacall'))"
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1.10'
          arch: x64
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1
        env:
          JULIA_CONDAPKG_BACKEND: Null
          JULIA_PYTHONCALL_EXE: ${{ steps.setup-python.outputs.python-path }}
      - name: Run Python interop smoke
        shell: bash
        env:
          JULIA_CONDAPKG_BACKEND: Null
          JULIA_PYTHONCALL_EXE: ${{ steps.setup-python.outputs.python-path }}
          JULIA_PROJECT: ${{ github.workspace }}
          PYTHON_JULIACALL_EXE: julia
          PYTHON_JULIACALL_PROJECT: ${{ github.workspace }}
        run: |
          "${{ steps.setup-python.outputs.python-path }}" scripts/python_interop_smoke.py --require-installed
