name: Docs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep only the newest docs run per ref so stale deploy/check runs do not pile up.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version:
          - "1.10"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          "${{ steps.setup-python.outputs.python-path }}" -m pip install --upgrade pip setuptools wheel juliacall sympy
          "${{ steps.setup-python.outputs.python-path }}" -m pip install --no-build-isolation --no-deps -e .
          "${{ steps.setup-python.outputs.python-path }}" -c "import sys, sympy; print(sys.executable); print(sympy.__version__)"

      - name: Smoke-check notebooks
        run: |
          "${{ steps.setup-python.outputs.python-path }}" docs/smoke_notebooks.py

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}

      - name: Execute representative notebook smoke test
        env:
          JULIA_CONDAPKG_BACKEND: Null
          JULIA_PYTHONCALL_EXE: ${{ steps.setup-python.outputs.python-path }}
          PYTHON_JULIACALL_EXE: julia
          PYTHON_JULIACALL_PROJECT: ${{ github.workspace }}
        run: |
          "${{ steps.setup-python.outputs.python-path }}" docs/execute_notebook_smoke.py docs/src/notebooks/LAlatex_L_show_Guide.ipynb
          "${{ steps.setup-python.outputs.python-path }}" docs/execute_notebook_smoke.py docs/src/notebooks/LAlatex_cases_Guide.ipynb
          "${{ steps.setup-python.outputs.python-path }}" docs/execute_notebook_smoke.py docs/src/notebooks/LAlatex_aligned_Guide.ipynb
          "${{ steps.setup-python.outputs.python-path }}" docs/execute_notebook_smoke.py docs/src/notebooks/LAlatex_basics.ipynb
          "${{ steps.setup-python.outputs.python-path }}" docs/execute_all_notebooks.py docs/src/notebooks/LAlatex_from_Python.ipynb

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v3

      - name: Build docs
        env:
          JULIA_CONDAPKG_BACKEND: Null
          JULIA_PYTHONCALL_EXE: ${{ steps.setup-python.outputs.python-path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LALATEX_DOCS_DEPLOY: "false"
        # docs/make.jl refreshes the dev path, resolves, instantiates, runs doctests,
        # and deploys only from the deploy-docs job.
        run: julia --project=docs docs/make.jl

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          "${{ steps.setup-python.outputs.python-path }}" -m pip install --upgrade pip sympy
          "${{ steps.setup-python.outputs.python-path }}" -c "import sys, sympy; print(sys.executable); print(sympy.__version__)"

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.10"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v3

      - name: Deploy docs
        env:
          JULIA_CONDAPKG_BACKEND: Null
          JULIA_PYTHONCALL_EXE: ${{ steps.setup-python.outputs.python-path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LALATEX_DOCS_DEPLOY: "true"
        run: julia --project=docs docs/make.jl
