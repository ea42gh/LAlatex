name: Register Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trigger Registrator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body='@JuliaRegistrator register

          Release notes:

          - Added display-math equation annotations with `tag` and `label`.
          - Added set-builder notation via `such_that`.
          - Added Python interop helpers and Binder demo support.
          - Broadened IOCapture compatibility to include 1.x.'
