[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lalatex-jl-bridge"
version = "1.2.1"
description = "Python helper bridge for LAlatex.jl via juliacall"
requires-python = ">=3.10"
dependencies = ["juliacall"]

[tool.setuptools]
py-modules = ["lalatex"]
package-dir = {"" = "python"}
